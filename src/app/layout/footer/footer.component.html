<div class="footer-contenedor">

  <div
    *ngIf="isLoadingTotals$ |async"
    class="loading-message"
  >
    <mat-spinner diameter="24"></mat-spinner>
    <span>⏳ Calculando totales... </span>
  </div>

  <div class="footer-main">
    <app-totals-card
      title="Total of species"
      [chipData]="(speciesTotals$ | async) ?? []"
    ></app-totals-card>

    <div class="dividor"></div>

    <app-totals-card
      title="Total of types"
      [chipData]="(typeTotals$ | async) ?? []"
    ></app-totals-card>

  </div>
</div>
