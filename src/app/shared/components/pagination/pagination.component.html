<div
  class="pagination-container"
  *ngIf="totalPages > 1"
>
  <div class="pagination-wrapper">

    <button
      mat-icon-button
      (click)="onPrevious()"
      [disabled]="currentPage === 1"
      aria-label="Página anterior"
    >
      <mat-icon class="nav-arrow">chevron_left</mat-icon>
    </button>

    <ng-container *ngFor="let page of pagesRange">
      <button
        *ngIf="page !== '...' && page === currentPage"
        mat-flat-button
        class="number-button active-page"
      >
        {{ page }}
      </button>

      <button
        *ngIf="page !== '...' && page !== currentPage"
        mat-button
        class="number-button"
        (click)="onPageClick(page)"
      >
        {{ page }}
      </button>

      <span
        *ngIf="page === '...'"
        class="pagination-ellipsis"
      >
        <mat-icon>more_horiz</mat-icon>
      </span>

    </ng-container>

    <button
      mat-icon-button
      (click)="onNext()"
      [disabled]="currentPage === totalPages"
      aria-label="Página siguiente"
    >
      <mat-icon class="nav-arrow">chevron_right</mat-icon>
    </button>

  </div>
</div>
